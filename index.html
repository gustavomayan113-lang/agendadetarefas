<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> - Gestão de Licitações</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header>
  <h1><span>📋</span><span class="brand"> Licitações</span></h1>
  <div class="controls">
    <button class="themebtn" id="theme">🌙</button>
    <input id="me" placeholder="Seu nome" maxlength="20" style="width:130px">
    <button class="ghost" id="export">Exportar</button>
    <button class="ghost" id="importBtn">Importar</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-view="dashboard">Painel</button>
  <button class="tab" data-view="licitacoes">Licitações</button>
  <button class="tab" data-view="agenda">Agenda</button>
  <button class="tab" data-view="historico">Histórico</button>
</div>

<div class="layout" id="dashboardView">
  <section class="panel" style="grid-column:1/-1">
    <h2>Resumo</h2>
    <div class="stats">
      <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Editais</div></div>
      <div class="stat"><div class="n" id="stAndamento">0</div><div class="l">Em andamento</div></div>
      <div class="stat"><div class="n" id="stGanhas">0</div><div class="l">Ganhas</div></div>
      <div class="stat"><div class="n" id="stPerdidas">0</div><div class="l">Perdidas</div></div>
      <div class="stat"><div class="n" id="stNao">0</div><div class="l">Não participou</div></div>
      <div class="stat"><div class="n" id="stTarefas">0</div><div class="l">Tarefas abertas</div></div>
    </div>
    <div id="alerts"></div>
  </section>
</div>

<div class="layout" id="licitacoesView" hidden>
  <section class="panel">
    <h2>Cadastrar edital</h2>
    <form class="add" id="fLic">
      <div class="row"><input type="text" id="lTitle" placeholder="Objeto/Edital" required></div>
      <div class="row">
        <input type="text" id="lOrgao" placeholder="Órgão">
        <input type="text" id="lNumero" placeholder="Número">
      </div>
      <div class="row">
        <input type="date" id="lPrazo" required>
        <input type="time" id="lHora">
      </div>
      <div class="row">
        <label><input type="checkbox" id="cVistoria"> Vistoria</label>
        <label><input type="checkbox" id="cGarantia"> Garantia</label>
        <label><input type="checkbox" id="cComposicao"> Composições</label>
        <label><input type="checkbox" id="cDocs"> Documentos</label>
      </div>
      <div class="row"><textarea id="lExig" placeholder="Exigências detalhadas" rows="3"></textarea></div>
      <div class="row">
        <select id="lResp"><option value="">Responsável</option></select>
        <button type="submit">Cadastrar</button>
      </div>
    </form>
  </section>
  <section class="panel">
    <h2>Lista de editais</h2>
    <div class="searchbar">
      <input id="searchLic" placeholder="Buscar...">
      <select id="filterStatus"><option value="all">Todos</option><option value="andamento">Em andamento</option><option value="ganha">Ganha</option><option value="perdida">Perdida</option><option value="nao">Não participou</option></select>
    </div>
    <div id="licList"></div>
  </section>
</div>

<div class="layout" id="agendaView" hidden>
  <section class="panel">
    <h2>Nova tarefa</h2>
    <form class="add" id="fTask">
      <div class="row"><input type="text" id="tTitle" placeholder="Tarefa" required></div>
      <div class="row">
        <select id="tLic"><option value="">Vincular edital (opcional)</option></select>
        <select id="tResp"><option value="">Responsável</option></select>
      </div>
      <div class="row">
        <input type="date" id="tDate" required>
        <input type="time" id="tTime">
        <button type="submit">Adicionar</button>
      </div>
    </form>
  </section>
  <section class="panel">
    <h2>Agenda compartilhada</h2>
    <div class="filterrow">
      <button class="filter active" data-f="all">Todas</button>
      <button class="filter" data-f="aberta">Abertas</button>
      <button class="filter" data-f="feita">Feitas</button>
    </div>
    <div id="taskList"></div>
  </section>
</div>

<div class="layout" id="historicoView" hidden>
  <section class="panel" style="grid-column:1/-1">
    <h2>Histórico de resultados</h2>
    <div id="histList"></div>
  </section>
</div>

</div>
<div class="toast" id="toast"></div>
<script src="javascript.js"></script>
</body>
</html>
