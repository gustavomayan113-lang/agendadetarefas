<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Licitações</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header>
  <h1><span>📋</span><span class="brand">Agenda de Licitações</span></h1>
  <div class="controls">
    <button class="themebtn" id="theme">🌙</button>
    <input id="me" placeholder="Seu nome" maxlength="20" style="width:130px">
  </div>
</header>

<section class="panel">
  <h2>Nova tarefa</h2>
  <form class="add" id="f">
    <div class="row"><input type="text" id="title" placeholder="Tarefa / licitação" required></div>
    <div class="row">
      <input type="text" id="who2" placeholder="Responsável" maxlength="20">
      <input type="date" id="date" required>
      <input type="time" id="time">
      <button type="submit">Adicionar</button>
    </div>
  </form>
</section>

<section class="panel">
  <h2>Tarefas</h2>
  <div class="filterrow">
    <button class="filter active" data-f="all">Todas</button>
    <button class="filter" data-f="todo">A fazer</button>
    <button class="filter" data-f="doing">Em andamento</button>
    <button class="filter" data-f="done">Concluída</button>
  </div>
  <div id="list"></div>
</section>
</div>
<div class="toast" id="toast"></div>
<script src="javascript.js"></script>
</body>
</html>
