<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Licitações</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header>
  <h1><span>📋</span><span class="brand">Agenda de Licitações</span></h1>
  <div class="controls">
    <button class="themebtn" id="theme">🌙</button>
    <input id="me" placeholder="Seu nome" maxlength="20" style="width:130px">
  </div>
</header>

<section class="panel">
  <h2>Nova tarefa</h2>
  <form class="add" id="f">
    <div class="row"><input type="text" id="title" placeholder="Tarefa / licitação" required></div>
    <div class="row">
      <input type="text" id="who2" placeholder="Responsável" maxlength="20">
      <input type="date" id="date" required>
      <input type="time" id="time">
      <button type="submit">Adicionar</button>
    </div>
  </form>
</section>

<div class="kanban">
  <div class="column" data-status="todo"><div class="colhead">A fazer <span class="count" id="cTodo">0</span></div><div class="cards" id="colTodo"></div></div>
  <div class="column" data-status="doing"><div class="colhead">Em andamento <span class="count" id="cDoing">0</span></div><div class="cards" id="colDoing"></div></div>
  <div class="column" data-status="done"><div class="colhead">Concluída <span class="count" id="cDone">0</span></div><div class="cards" id="colDone"></div></div>
  <div class="column" data-status="cancelada"><div class="colhead">Cancelada <span class="count" id="cCancelada">0</span></div><div class="cards" id="colCancelada"></div></div>
  <div class="column" data-status="perdida"><div class="colhead">Perdida <span class="count" id="cPerdida">0</span></div><div class="cards" id="colPerdida"></div></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="javascript.js"></script>
</body>
</html>
